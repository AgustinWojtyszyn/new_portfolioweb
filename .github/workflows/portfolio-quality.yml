name: Portfolio quality checks

on:
  push:
    branches: [main, portfolio-refresh-rpg-premium-20261009]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE_URL: https://agustinwojtyszyn.com
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SITE_URL: https://agustinwojtyszyn.com
